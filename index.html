<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anip在线观影</title>
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f6">
<link rel="icon" href="/static/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png">
<link rel="apple-touch-icon" href="/static/favicon-192.png">
<style>
:root{
    --accent:#2563eb; --accent2:#7c3aed; --accent3:#06b6d4;
    --accent-hover:#1d4ed8; --danger:#ff6b6b; --ok:#4ade80;
    --bg:#0b0f1a; --bg2:#131a2e;
    --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.06);
    --panel:rgba(255,255,255,.07); --panel2:rgba(255,255,255,.1);
    --hover:rgba(255,255,255,.12);
    --border:rgba(255,255,255,.09);
    --text:#f1f5f9; --text2:#94a3b8; --text3:#64748b;
    --overlay:rgba(8,10,18,.78);
    --glow:rgba(37,99,235,.35);
    --grad:linear-gradient(135deg,#2563eb,#7c3aed 55%,#06b6d4);
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --radius:16px;
    color-scheme:dark;
}
@media (prefers-color-scheme: light){
    :root{
        --accent:#2563eb; --accent2:#7c3aed; --accent3:#0891b2;
        --accent-hover:#1d4ed8; --danger:#e11d48; --ok:#16a34a;
        --bg:#f6f8fc; --bg2:#e9edfb;
        --card:rgba(255,255,255,.72); --card2:rgba(255,255,255,.85);
        --panel:rgba(15,23,42,.045); --panel2:rgba(15,23,42,.07);
        --hover:rgba(15,23,42,.09);
        --border:rgba(15,23,42,.1);
        --text:#0f172a; --text2:#475569; --text3:#94a3b8;
        --overlay:rgba(244,247,252,.78);
        --glow:rgba(37,99,235,.18);
        --shadow:0 10px 30px rgba(15,23,42,.1);
        color-scheme:light;
    }
}
*{box-sizing:border-box;margin:0;padding:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
html{scrollbar-color:var(--panel2) transparent}
body{
    background:
        radial-gradient(1100px 500px at 85% -10%, var(--glow), transparent 60%),
        radial-gradient(900px 500px at -10% 20%, rgba(124,58,237,.16), transparent 55%),
        linear-gradient(160deg, var(--bg), var(--bg2));
    background-attachment:fixed;
    min-height:100vh;
    padding:20px;
}
body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
        radial-gradient(600px 300px at 10% 85%, var(--glow), transparent 60%),
        radial-gradient(500px 260px at 95% 60%, rgba(6,182,212,.1), transparent 55%);
}
.container{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start;position:relative;z-index:1}
#video-box{position:relative;width:100%;background:#000;border-radius:var(--radius);padding-bottom:56.25%;overflow:hidden;box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.06),0 0 40px var(--glow)}
#artBox{position:absolute;top:0;left:0;width:100%;height:100%;display:block;background:#000}
.anime-title-overlay{position:absolute;top:0;left:0;right:0;z-index:2;padding:8px 12px;font-size:12px;font-weight:bold;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,0));pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.ep-wrap{background:var(--card);padding:14px;border-radius:var(--radius);border:1px solid var(--border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.info-text{font-size:13px;font-weight:600;letter-spacing:.5px;color:var(--text2)}
.ep-list{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow-y:auto;padding-right:4px;scrollbar-width:thin}
.ep-item{padding:10px 12px;background:var(--panel);border:1px solid transparent;border-radius:10px;cursor:pointer;transition:.22s;min-height:40px;font-size:14px;line-height:20px;color:var(--text2)}
.ep-item:hover{background:var(--hover);color:var(--text);border-color:var(--border);transform:translateX(2px)}
.ep-item.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px var(--glow);font-weight:600}
.err-text{font-size:13px;color:var(--danger);margin:8px 0}
.history-wrap,.log-wrap,.all-anime-wrap{max-width:1400px;margin:24px auto 0 auto;background:var(--card);padding:16px 18px;border-radius:var(--radius);border:1px solid var(--border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.history-wrap h3,.log-wrap h3,.all-anime-wrap h3{margin:0;font-size:16px;letter-spacing:.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
.history-head,.log-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.history-clear-btn{padding:5px 14px;background:var(--panel);border:1px solid var(--border);border-radius:999px;cursor:pointer;font-size:12px;color:var(--text2);transition:.2s}
.history-clear-btn:hover{background:var(--hover);color:var(--danger);border-color:var(--danger)}
.history-del-btn{flex-shrink:0;width:22px;height:22px;line-height:20px;text-align:center;border:none;background:transparent;color:var(--text3);font-size:14px;cursor:pointer;border-radius:6px;transition:.2s;padding:0}
.history-del-btn:hover{background:var(--danger);color:#fff}
.history-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.history-list{display:flex;flex-direction:column;gap:6px}
.history-item{padding:10px 14px;background:var(--panel);border:1px solid transparent;border-radius:12px;cursor:pointer;transition:.22s;display:flex;justify-content:space-between;align-items:center;gap:10px}
.history-item:hover{background:var(--hover);border-color:var(--border);transform:translateY(-1px)}
.history-title{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-meta{font-size:12px;color:var(--text3);flex-shrink:0;font-variant-numeric:tabular-nums}
.history-empty{font-size:14px;color:var(--text3);padding:10px 0}
.log-list{display:flex;flex-direction:column;gap:4px;max-height:50px;overflow-y:auto;padding-right:4px;scrollbar-width:thin}
.log-line{font-size:10px;line-height:14px;color:var(--text2);font-family:Consolas,"SF Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-line.log-status{color:var(--ok)}
.all-anime-wrap h3{margin-bottom:14px}
.anime-filter{width:100%;padding:10px 14px;background:var(--panel);border:1px solid var(--border);border-radius:12px;font-size:14px;color:var(--text);margin-bottom:12px;outline:none;transition:.2s}
.anime-filter:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.anime-filter::placeholder{color:var(--text3)}
.anime-type-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.type-btn{padding:6px 16px;background:var(--panel);border:1px solid var(--border);border-radius:999px;cursor:pointer;font-size:13px;color:var(--text2);transition:.22s}
.type-btn:hover{background:var(--hover);color:var(--text);transform:translateY(-1px)}
.type-btn.active{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 14px var(--glow);font-weight:600}
.anime-card-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.anime-card{position:relative;padding:12px 14px;background:var(--panel);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:.25s;overflow:hidden}
.anime-card::before{content:"";position:absolute;inset:0;background:var(--grad);opacity:0;transition:.25s;pointer-events:none}
.anime-card:hover{background:var(--hover);transform:translateY(-3px);box-shadow:0 10px 24px var(--glow);border-color:var(--accent)}
.anime-card:hover::before{opacity:.08}
.anime-card.loading{color:var(--text3);cursor:default;transform:none}
.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;background-position:center;background-size:cover;transition:opacity 1.3s ease;-webkit-transition:opacity 1.3s ease}
#bgA{opacity:1}#bgB{opacity:0}
#logWrap,#historyWrap,#allAnimeWrap{position:relative;z-index:1}
.login-overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:100;display:flex;align-items:center;justify-content:center}
.login-overlay::before{content:"";position:absolute;left:50%;top:50%;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 65%);filter:blur(12px);transform:translate(-50%,-50%);animation:loginFloat 9s ease-in-out infinite}
.login-overlay.hidden{display:none}
.login-box{position:relative;background:var(--card);padding:36px 32px;border-radius:20px;border:1px solid var(--border);width:320px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow),0 0 60px var(--glow)}
.login-title{font-size:20px;font-weight:700;text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.login-input{padding:11px 14px;background:var(--panel);border:1px solid var(--border);border-radius:12px;font-size:14px;color:var(--text);outline:none;transition:.2s}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.login-err{font-size:13px;color:var(--danger);min-height:16px;text-align:center}
.login-btn{padding:11px;background:var(--grad);border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;color:#fff;transition:.25s;letter-spacing:2px}
.login-btn:hover{filter:brightness(1.1);box-shadow:0 6px 20px var(--glow);transform:translateY(-1px)}
@keyframes loginFloat{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.15)}}
@media (max-width:1100px){
    .container{grid-template-columns:1fr;gap:12px}
    #video-box.vb-fixed{position:fixed;top:0;left:0;right:0;z-index:50;border-radius:0;margin:0}
    .login-box{width:min(320px,92vw)}
    .anime-card-list{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}

</style>
</head>
<body>
<div id="bgA" class="bg-layer"></div>
<div id="bgB" class="bg-layer"></div>
<div class="container">
    <div id="video-box">
        <div id="animeTitle" class="anime-title-overlay">选择下方番剧开始播放</div>
        <div id="artBox"></div>
    </div>
    <div class="side">
        <div class="ep-wrap">
            <div class="info-text">播放列表</div>
            <div id="epList" class="ep-list"></div>
        </div>
    </div>
</div>
<div id="logWrap" class="log-wrap">
    <div class="log-head"><h3>播放与缓存日志</h3></div>
    <div id="errBox" class="err-text"></div>
    <div id="logList" class="log-list"></div>
</div>
<div id="historyWrap" class="history-wrap">
    <div class="history-head">
        <h3>播放历史</h3>
        <button id="historyClearBtn" class="history-clear-btn" type="button">清空全部</button>
    </div>
    <div id="historyList" class="history-list"></div>
</div>
<div id="allAnimeWrap" class="all-anime-wrap">
    <h3>剧集列表</h3>
    <div id="animeTypeBar" class="anime-type-bar"></div>
    <input id="animeFilter" class="anime-filter" type="text" placeholder="输入关键词筛选番剧标题…">
    <div id="animeCardList" class="anime-card-list"></div>
</div>

<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <div class="login-title">Anip在线观影</div>
        <input id="loginPwd" class="login-input" type="password" placeholder="请输入访问密码">
        <div id="loginErr" class="login-err"></div>
        <button id="loginBtn" class="login-btn">进入</button>
    </div>
</div>

<!-- 本地静态库，先加载库，再执行业务脚本 -->

<script src="/static/artplayer.min.js"></script>

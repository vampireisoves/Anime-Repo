<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anip在线观影</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;color:#eee;font-family:system-ui}
body{background:#111;padding:16px}
.container{max-width:1400px;margin:0 auto;display:grid;grid-template-columns: 1fr 320px;gap:16px;align-items:start}
#video-box{position:relative;width:100%;background:#000;border-radius:8px;padding-bottom:56.25%;overflow:hidden}
#player{position:absolute;top:0;left:0;width:100%;height:100%;display:block;background:#000}
.anime-title-overlay{position:absolute;top:0;left:0;right:0;z-index:2;padding:12px 16px;font-size:18px;font-weight:bold;color:#eee;background:linear-gradient(180deg,rgba(0,0,0,.8),rgba(0,0,0,0));pointer-events:none}
.fs-btn{position:absolute;top:10px;right:12px;z-index:3;padding:6px 12px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.25);border-radius:6px;font-size:13px;color:#eee;cursor:pointer;transition:.2s}
.fs-btn:hover{background:rgba(255,255,255,.15)}
.fs-btn.active{background:#2563eb;border-color:#2563eb}
.speed-info{position:absolute;right:12px;bottom:44px;z-index:2;padding:3px 8px;background:rgba(0,0,0,.55);border-radius:4px;font-size:12px;color:#eee;pointer-events:none;font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.info-text{font-size:14px;color:#aaa}
.ep-wrap{background:#222;padding:12px;border-radius:8px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.ep-list{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow-y:auto;padding-right:4px}
.ep-item{padding:10px;background:#333;border-radius:4px;cursor:pointer;transition:.2s;height:40px;line-height:20px}
.ep-item:hover{background:#444}
.ep-item.active{background:#2563eb}
.err-text{font-size:14px;color:#ff6b6b;margin:8px 0}
.history-wrap{max-width:1400px;margin:24px auto 0 auto;background:#1e1e1e;padding:16px;border-radius:8px}
.history-wrap h3{margin:0}
.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.history-clear-btn{padding:4px 12px;background:#2d2d2d;border:1px solid #3a3a3a;border-radius:4px;cursor:pointer;font-size:12px;color:#aaa;transition:.2s}
.history-clear-btn:hover{background:#3b3b3b;color:#ff6b6b}
.history-del-btn{flex-shrink:0;width:22px;height:22px;line-height:20px;text-align:center;border:none;background:transparent;color:#888;font-size:14px;cursor:pointer;border-radius:4px;transition:.2s;padding:0}
.history-del-btn:hover{background:#444;color:#ff6b6b}
.history-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.history-list{display:flex;flex-direction:column;gap:6px}
.history-item{padding:10px 12px;background:#2d2d2d;border-radius:6px;cursor:pointer;transition:.2s;display:flex;justify-content:space-between;align-items:center;gap:10px}
.history-item:hover{background:#3b3b3b}
.history-title{font-size:14px;min-width:0}
.history-meta{font-size:12px;color:#888;flex-shrink:0}
.history-empty{font-size:14px;color:#888;padding:10px 0}
.log-wrap{max-width:1400px;margin:24px auto 0 auto;background:#1e1e1e;padding:16px;border-radius:8px}
.log-wrap h3{margin:0}
.log-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.log-list{display:flex;flex-direction:column;gap:4px;max-height:66px;overflow-y:auto;padding-right:4px}
.log-line{font-size:12px;color:#aaa;font-family:Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-line.log-status{color:#4ade80}
.all-anime-wrap{max-width:1400px;margin:24px auto 0 auto;background:#1e1e1e;padding:16px;border-radius:8px}
.all-anime-wrap h3{margin-bottom:12px}
.anime-filter{width:100%;padding:10px 12px;background:#2d2d2d;border:1px solid #3a3a3a;border-radius:6px;font-size:14px;color:#eee;margin-bottom:12px;outline:none}
.anime-filter:focus{border-color:#2563eb}
.anime-filter::placeholder{color:#888}
.anime-type-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.type-btn{padding:6px 16px;background:#2d2d2d;border:1px solid #3a3a3a;border-radius:6px;cursor:pointer;font-size:13px;color:#aaa;transition:.2s}
.type-btn:hover{background:#3b3b3b;color:#eee}
.type-btn.active{background:#2563eb;border-color:#2563eb;color:#fff}
.anime-card-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.anime-card{padding:10px 12px;background:#2d2d2d;border-radius:6px;cursor:pointer;transition:.2s}
.anime-card:hover{background:#3b3b3b}
.anime-card.loading{color:#888;cursor:default}
.login-overlay{position:fixed;inset:0;background:rgba(17,17,17,.96);z-index:100;display:flex;align-items:center;justify-content:center}
.login-overlay.hidden{display:none}
.login-box{background:#1e1e1e;padding:32px;border-radius:12px;width:320px;display:flex;flex-direction:column;gap:14px}
.login-title{font-size:18px;font-weight:bold;text-align:center}
.login-input{padding:10px 12px;background:#2d2d2d;border:1px solid #3a3a3a;border-radius:6px;font-size:14px;color:#eee;outline:none}
.login-input:focus{border-color:#2563eb}
.login-err{font-size:13px;color:#ff6b6b;min-height:16px;text-align:center}
.login-btn{padding:10px;background:#2563eb;border:none;border-radius:6px;font-size:15px;cursor:pointer;color:#fff}
.login-btn:hover{background:#1d4ed8}
body.player-fs{padding:0;overflow:hidden;height:100vh}
body.player-fs .container{max-width:none;height:100vh;display:block;padding:0}
body.player-fs .side{display:none}
body.player-fs .history-wrap{display:none}
body.player-fs .all-anime-wrap{display:none}
body.player-fs #video-box{height:100vh;padding-bottom:0;border-radius:0}
body.player-fs #player{width:100%;height:100%;object-fit:contain}
@media (max-width:900px){
    .container{grid-template-columns:1fr;gap:12px}
    #video-box{position:sticky;top:0;z-index:10}
    .login-box{width:min(320px,92vw)}
    .anime-card-list{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}
</style>
</head>
<body>
<div class="container">
    <div id="video-box">
        <div id="animeTitle" class="anime-title-overlay">选择下方番剧开始播放</div>
        <button id="fsBtn" class="fs-btn" type="button">窗口全屏</button>
        <div id="speedInfo" class="speed-info"></div>
        <video id="player" controls></video>
    </div>
    <div class="side">
        <div class="ep-wrap">
            <div class="info-text">播放列表</div>
            <div id="epList" class="ep-list"></div>
        </div>
    </div>
</div>
<div id="logWrap" class="log-wrap">
    <div class="log-head"><h3>播放与缓存日志</h3></div>
    <div id="errBox" class="err-text"></div>
    <div id="logList" class="log-list"></div>
</div>
<div id="historyWrap" class="history-wrap">
    <div class="history-head">
        <h3>播放历史</h3>
        <button id="historyClearBtn" class="history-clear-btn" type="button">清空全部</button>
    </div>
    <div id="historyList" class="history-list"></div>
</div>
<div id="allAnimeWrap" class="all-anime-wrap">
    <h3>剧集列表</h3>
    <div id="animeTypeBar" class="anime-type-bar"></div>
    <input id="animeFilter" class="anime-filter" type="text" placeholder="输入关键词筛选番剧标题…">
    <div id="animeCardList" class="anime-card-list"></div>
</div>

<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <div class="login-title">Anip在线观影</div>
        <input id="loginPwd" class="login-input" type="password" placeholder="请输入访问密码">
        <div id="loginErr" class="login-err"></div>
        <button id="loginBtn" class="login-btn">进入</button>
    </div>
</div>

<!-- 本地静态hls，先加载库，再执行业务脚本 -->
<script src="/static/hls.min.js"></script>
<script>
const LOGIN_PWDS = ["anip19941104", "hy19960414", "test123456"];
const loginOverlay = document.getElementById('loginOverlay');
const loginPwd = document.getElementById('loginPwd');
const loginBtn = document.getElementById('loginBtn');
const loginErr = document.getElementById('loginErr');

function checkLogin(){
    if(sessionStorage.getItem('anip_authed') === '1'){
        if(loginOverlay) loginOverlay.classList.add('hidden');
        return true;
    }
    return false;
}
function doLogin(){
    if(!loginPwd || !loginOverlay) return;
    if(LOGIN_PWDS.includes(loginPwd.value)){
        sessionStorage.setItem('anip_authed', '1');
        loginOverlay.classList.add('hidden');
        loginErr.textContent = '';
    }else{
        loginErr.textContent = '密码错误，请重试';
        loginPwd.value = '';
        loginPwd.focus();
    }
}
if(loginBtn) loginBtn.onclick = doLogin;
if(loginPwd) loginPwd.addEventListener('keydown', e=>{ if(e.key === 'Enter') doLogin(); });
checkLogin();

let episodes = [];
let animeName = "";
let currentEpIndex = 0;
const player = document.getElementById('player');
const epListEl = document.getElementById('epList');
const errBox = document.getElementById('errBox');
const animeTitleEl = document.getElementById('animeTitle');
const allAnimeWrap = document.getElementById('allAnimeWrap');
const animeCardList = document.getElementById('animeCardList');
const animeFilterEl = document.getElementById('animeFilter');
const animeTypeBarEl = document.getElementById('animeTypeBar');
let hls = null;
let repoAnimeList = [];
let currentType = "全部";
let currentJsonFile = "";
let pendingSeek = null;
const TYPE_LIST = ["全部", "电影", "剧集", "动漫"];

// 安全防护：如果Hls不存在直接报错提示
if(typeof Hls === "undefined"){
    errBox.textContent = "错误：hls.js 库加载失败";
}

function getUrlParam(key){
    const params = new URLSearchParams(location.search);
    return params.get(key);
}

async function loadJson(jsonUrl){
    currentJsonFile = jsonUrl;
    errBox.textContent = "加载中...";
    animeTitleEl.textContent = "加载番剧信息...";
    try{
        const res = await fetch(jsonUrl);
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        animeName = data.title;
        episodes = data.episodes;
        animeTitleEl.textContent = animeName;
        const savedKey = `lastEp_${btoa(jsonUrl)}`;
        const saved = localStorage.getItem(savedKey);
        if(saved !== null) currentEpIndex = parseInt(saved);
        else currentEpIndex = 0;
        addLog('加载番剧：' + animeName + '（' + episodes.length + '集）');
        renderEpList();
        playEp(currentEpIndex);
        errBox.textContent = "";
    }catch(e){
        errBox.textContent = `JSON读取失败: ${e.message}`;
        addLog('加载失败：' + e.message);
        console.error("加载json错误：",e);
    }
}

function renderEpList(){
    epListEl.innerHTML = '';
    episodes.forEach((ep,idx)=>{
        const div = document.createElement('div');
        div.className = "ep-item" + (idx === currentEpIndex ? " active":"");
        div.textContent = ep.title;
        div.onclick = ()=>{
            currentEpIndex = idx;
            playEp(currentEpIndex);
            renderEpList();
        }
        epListEl.appendChild(div);
    })
    const active = epListEl.querySelector('.ep-item.active');
    if(active) active.scrollIntoView({block:'nearest'});
}

function playEp(idx){
    if(typeof Hls === "undefined"){
        errBox.textContent = "hls库未加载，无法播放";
        return;
    }
    const ep = episodes[idx];
    if(hls){
        hls.destroy();
        hls = null;
    }
    resetSpeed();
    cacheDoneLogged = false;
    addLog('开始播放：' + (ep.title || ('第' + (idx+1) + '集')));
    if(Hls.isSupported()) {
        hls = new Hls({enableWorker:true, lowLatencyMode:false, maxBufferLength:Infinity, maxMaxBufferLength:Infinity, maxBufferSize:Infinity, maxBufferHole:3, fragLoadingConcurrency:8});
        hls.loadSource(ep.src);
        hls.attachMedia(player);
        hls.on(Hls.Events.MANIFEST_PARSED,()=>{ player.play(); });
        hls.on(Hls.Events.FRAG_LOADED,(e,data)=>{
            const st = data && data.frag && data.frag.stats;
            if(st && st.loaded){
                speedState.bytes += st.loaded;
            }
        });

        let hlsErrCount = 0;
        hls.on(Hls.Events.ERROR, (e, data)=>{
            if(!data || !data.fatal) return;
            hlsErrCount++;
            if(hlsErrCount > 5){
                errBox.textContent = '播放错误：' + (data.details || '未知错误') + '，已停止重试，请刷新或重选';
                addLog('播放错误，已停止重试：' + (data.details || '未知错误'));
                return;
            }
            if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
                errBox.textContent = '网络错误(' + (data.details || '') + ')，自动重连中…';
                addLog('网络错误(' + (data.details || '') + ')，自动重连');
                hls.startLoad();
            }else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
                errBox.textContent = '媒体错误(' + (data.details || '') + ')，尝试恢复…';
                addLog('媒体错误(' + (data.details || '') + ')，尝试恢复');
                hls.recoverMediaError();
            }else{
                errBox.textContent = '播放错误：' + (data.details || data.type || '未知');
                addLog('播放错误：' + (data.details || data.type || '未知'));
                hls.destroy();
                hls = null;
            }
        });
    }else if(player.canPlayType('application/vnd.apple.mpegurl')){
        player.src = ep.src;
        player.play();
    }
    const savedKey = `lastEp_${btoa(currentJsonFile)}`;
    localStorage.setItem(savedKey, idx.toString());
    saveHistory();
    renderHistory();
    const jf = String(currentJsonFile).replace(/^\//, '');
    if(pendingSeek && pendingSeek.jsonFile === jf && pendingSeek.epIndex === idx){
        const sec = pendingSeek.pos || 0;
        pendingSeek = null;
        const doSeek = ()=>{ try{ if(!isNaN(sec) && sec > 0) player.currentTime = sec; }catch(e){} };
        if(player.readyState >= 1){ doSeek(); }
        else{ player.addEventListener('loadedmetadata', doSeek, {once:true}); }
    }
}

document.addEventListener('keydown',e=>{
    const tag = (e.target && e.target.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    if(e.repeat) return;
    if(e.key === "ArrowLeft"){
        e.preventDefault();
        if(player){
            player.currentTime = Math.max(0, (player.currentTime || 0) - 5);
        }
    }else if(e.key === "ArrowRight"){
        e.preventDefault();
        if(player){
            player.currentTime = (player.currentTime || 0) + 5;
        }
    }
})

document.addEventListener("visibilitychange", ()=>{
    if (!document.hidden && !player.paused && hls) hls.startLoad();
});

const HISTORY_KEY = 'anip_history';
const historyWrap = document.getElementById('historyWrap');
const historyList = document.getElementById('historyList');

function getHistory(){
    try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
    catch(e){ return []; }
}
function saveHistory(){
    try{
        const jf = String(currentJsonFile).replace(/^\//, '');
        const h = getHistory().filter(x => x.jsonFile !== jf);
        let pos = 0;
        if(pendingSeek && pendingSeek.jsonFile === jf && pendingSeek.epIndex === currentEpIndex){
            pos = pendingSeek.pos || 0;
        }
        h.unshift({title: animeName, jsonFile: jf, epTitle: episodes[currentEpIndex] ? episodes[currentEpIndex].title : '', epIndex: currentEpIndex, pos: pos, time: Date.now()});
        localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, 20)));
    }catch(e){}
}

function updateHistoryPos(){
    try{
        const jf = String(currentJsonFile).replace(/^\//, '');
        const h = getHistory();
        const item = h.find(x => x.jsonFile === jf && x.epIndex === currentEpIndex);
        if(item && player && !isNaN(player.currentTime) && player.currentTime > 0){
            item.pos = player.currentTime;
            localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
        }
    }catch(e){}
}
function fmtTime(t){
    const d = new Date(t);
    const pad = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function renderHistory(){
    if(!historyList) return;
    const h = getHistory();
    if(h.length === 0){
        historyList.innerHTML = '<div class="history-empty">暂无播放记录</div>';
        return;
    }
    historyList.innerHTML = '';
    h.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'history-item';
        const t = document.createElement('span');
        t.className = 'history-title';
        t.textContent = item.title + ' · ' + (item.epTitle || '');
        const m = document.createElement('span');
        m.className = 'history-meta';
        m.textContent = fmtTime(item.time);
        const del = document.createElement('button');
        del.className = 'history-del-btn';
        del.type = 'button';
        del.textContent = '✕';
        del.title = '删除该条记录';
        del.onclick = (ev)=>{
            ev.stopPropagation();
            const hh = getHistory();
            hh.splice(idx, 1);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(hh));
            renderHistory();
        };
        const right = document.createElement('span');
        right.className = 'history-right';
        right.appendChild(m);
        right.appendChild(del);
        div.appendChild(t);
        div.appendChild(right);
        div.onclick = ()=>{
            const url = '/' + String(item.jsonFile).replace(/^\//, '');
            try{ localStorage.setItem('lastEp_' + btoa(url), String(item.epIndex)); }catch(e){}
            pendingSeek = {jsonFile: item.jsonFile, epIndex: item.epIndex, pos: item.pos || 0};
            loadJson(url);
        };
        historyList.appendChild(div);
    });
}

const historyClearBtn = document.getElementById('historyClearBtn');
if(historyClearBtn){
    historyClearBtn.onclick = ()=>{
        if(!confirm('确定要清空全部播放历史吗？')) return;
        localStorage.removeItem(HISTORY_KEY);
        renderHistory();
    };
}

function initTypeBar(){
    animeTypeBarEl.innerHTML = '';
    TYPE_LIST.forEach(type => {
        const btn = document.createElement("button");
        btn.className = "type-btn";
        btn.textContent = type;
        btn.onclick = ()=>{
            currentType = type;
            initTypeBar();
            renderAnimeCards();
        };
        animeTypeBarEl.appendChild(btn);
    });
    [...animeTypeBarEl.children].forEach(b => b.classList.toggle('active', b.textContent === currentType));
}

function renderAnimeCards(){
    const kw = animeFilterEl.value.trim().toLowerCase();
    const kwMatched = kw ? repoAnimeList.filter(item => item.title.toLowerCase().includes(kw)) : repoAnimeList;
    const matched = currentType === "全部" ? kwMatched : kwMatched.filter(item => (item.type || "动漫") === currentType);
    animeCardList.innerHTML = '';
    if(matched.length === 0){
        animeCardList.innerHTML = '<div class="anime-card loading">未找到匹配的番剧</div>';
        return;
    }
    for(const item of matched){
        const card = document.createElement("div");
        card.className = "anime-card";
        card.textContent = item.title;
        card.onclick = ()=> loadJson(`/${item.jsonFile}`);
        animeCardList.appendChild(card);
    }
}

async function loadRepoAnimeList(){
    animeCardList.innerHTML = '<div class="anime-card loading">读取剧集列表中…</div>';
    try{
        const resp = await fetch(`/index.json`);
        const fileArr = await resp.json();
        if(!Array.isArray(fileArr)){
            animeCardList.innerHTML = '<div class="anime-card loading">剧集清单读取异常</div>';
            return;
        }
        if(fileArr.length === 0){
            animeCardList.innerHTML = '<div class="anime-card loading">清单为空，请检查index.json</div>';
            return;
        }
        repoAnimeList = fileArr;
        renderAnimeCards();
    }catch(err){
        animeCardList.innerHTML = '<div class="anime-card loading">获取剧集列表失败：'+err.message+'</div>';
    }
}

function syncSideHeight(){
    const vb = document.getElementById('video-box');
    const side = document.querySelector('.side');
    if(vb && side){
        if(window.innerWidth < 900){
            side.style.height = '';
        }else{
            side.style.height = vb.offsetHeight + 'px';
        }
    }
}
syncSideHeight();
window.addEventListener('resize', syncSideHeight);
setInterval(()=>{ if(player && !player.paused && episodes.length) updateHistoryPos(); }, 5000);

// 播放与缓存日志
const logList = document.getElementById('logList');
const logData = [];
let statusRow = null;
let cacheDoneLogged = false;
function fmtDur(s){
    if(!isFinite(s) || s < 0) return '--:--';
    s = Math.round(s);
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
    const pad = n => String(n).padStart(2,'0');
    return (h>0 ? h+':'+pad(m) : m) + ':' + pad(sec);
}
function renderLogs(){
    if(!logList) return;
    logList.innerHTML = '';
    logData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'log-line';
        div.textContent = '[' + item.time + '] ' + item.msg;
        logList.appendChild(div);
    });
    statusRow = document.createElement('div');
    statusRow.className = 'log-line log-status';
    statusRow.textContent = '缓存状态：等待播放…';
    logList.appendChild(statusRow);
    logList.scrollTop = logList.scrollHeight;
}
function addLog(msg){
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    const ts = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
    logData.push({time: ts, msg: msg});
    if(logData.length > 4) logData.shift();
    renderLogs();
}
function getCacheStatus(){
    try{
        if(!player || isNaN(player.duration) || player.duration <= 0) return null;
        const b = player.buffered;
        if(!b || b.length === 0) return null;
        const end = b.end(b.length - 1);
        return {end: end, duration: player.duration, pct: Math.min(100, end/player.duration*100)};
    }catch(e){ return null; }
}
renderLogs();

// 缓存速度统计
const speedInfoEl = document.getElementById('speedInfo');
const speedState = {bytes: 0, windowStart: 0};
function fmtSpeed(bps){
    if(bps >= 1048576) return (bps/1048576).toFixed(2) + ' MB/s';
    if(bps >= 1024) return Math.round(bps/1024) + ' KB/s';
    return Math.round(bps) + ' B/s';
}
function resetSpeed(){
    speedState.bytes = 0;
    speedState.windowStart = Date.now();
    if(speedInfoEl) speedInfoEl.textContent = '';
}
setInterval(()=>{
    const now = Date.now();
    const dt = (now - speedState.windowStart) / 1000;
    let spdText = '0 B/s';
    if(!hls){
        if(speedInfoEl) speedInfoEl.textContent = '';
        if(statusRow) statusRow.textContent = '缓存状态：等待播放…';
        return;
    }
    if(dt >= 1){
        spdText = fmtSpeed(speedState.bytes / dt);
        if(speedInfoEl) speedInfoEl.textContent = spdText;
        speedState.bytes = 0;
        speedState.windowStart = now;
    }else if(speedInfoEl && speedInfoEl.textContent){
        spdText = speedInfoEl.textContent;
    }
    const st = getCacheStatus();
    if(st){
        if(st.pct >= 99.5 && !cacheDoneLogged){
            cacheDoneLogged = true;
            addLog('整片缓存完成（' + fmtDur(st.duration) + '）');
        }
        if(statusRow) statusRow.textContent = '缓存状态：' + st.pct.toFixed(1) + '%（' + fmtDur(st.end) + ' / ' + fmtDur(st.duration) + '） · ' + spdText;
    }else{
        if(statusRow) statusRow.textContent = '缓存状态：加载中…';
    }
}, 500);

// 窗口内全屏：视频铺满当前浏览器窗口（不调用系统全屏API）
const fsBtn = document.getElementById('fsBtn');
if(fsBtn){
    fsBtn.onclick = ()=>{
        const on = document.body.classList.toggle('player-fs');
        fsBtn.textContent = on ? '退出窗口全屏' : '窗口全屏';
        fsBtn.classList.toggle('active', on);
        syncSideHeight();
    };
}

if(animeTypeBarEl) initTypeBar();
renderHistory();
if(animeFilterEl) animeFilterEl.addEventListener('input', renderAnimeCards);

const jsonUrl = getUrlParam('json');
if(jsonUrl){
    loadJson(jsonUrl);
}else{
    animeTitleEl.textContent = "选择下方番剧开始播放";
    errBox.textContent = "";
    loadRepoAnimeList();
}
</script>

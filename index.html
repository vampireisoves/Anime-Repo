<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anip在线观影</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;color:#eee;font-family:system-ui}
body{background:#111;padding:16px}
.container{max-width:1400px;margin:0 auto;display:grid;grid-template-columns: 1fr 320px;gap:16px;align-items:start}
#video-box{position:relative;width:100%;background:#000;border-radius:8px;padding-bottom:56.25%;overflow:hidden}
#player{position:absolute;top:0;left:0;width:100%;height:100%;display:block;background:#000}
.anime-title-overlay{position:absolute;top:0;left:0;right:0;z-index:2;padding:12px 16px;font-size:18px;font-weight:bold;color:#eee;background:linear-gradient(180deg,rgba(0,0,0,.8),rgba(0,0,0,0));pointer-events:none}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.info-text{font-size:14px;color:#aaa}
.ep-wrap{background:#222;padding:12px;border-radius:8px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.ep-list{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow-y:auto;padding-right:4px}
.ep-item{padding:10px;background:#333;border-radius:4px;cursor:pointer;transition:.2s;height:40px;line-height:20px}
.ep-item:hover{background:#444}
.ep-item.active{background:#2563eb}
.err-text{font-size:14px;color:#ff6b6b;margin:8px 0}
.all-anime-wrap{max-width:1400px;margin:24px auto 0 auto;background:#1e1e1e;padding:16px;border-radius:8px}
.all-anime-wrap h3{margin-bottom:12px}
.anime-filter{width:100%;padding:10px 12px;background:#2d2d2d;border:1px solid #3a3a3a;border-radius:6px;font-size:14px;color:#eee;margin-bottom:12px;outline:none}
.anime-filter:focus{border-color:#2563eb}
.anime-filter::placeholder{color:#888}
.anime-type-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.type-btn{padding:6px 16px;background:#2d2d2d;border:1px solid #3a3a3a;border-radius:6px;cursor:pointer;font-size:13px;color:#aaa;transition:.2s}
.type-btn:hover{background:#3b3b3b;color:#eee}
.type-btn.active{background:#2563eb;border-color:#2563eb;color:#fff}
.anime-card-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.anime-card{padding:10px 12px;background:#2d2d2d;border-radius:6px;cursor:pointer;transition:.2s}
.anime-card:hover{background:#3b3b3b}
.anime-card.loading{color:#888;cursor:default}
.login-overlay{position:fixed;inset:0;background:rgba(17,17,17,.96);z-index:100;display:flex;align-items:center;justify-content:center}
.login-overlay.hidden{display:none}
.login-box{background:#1e1e1e;padding:32px;border-radius:12px;width:320px;display:flex;flex-direction:column;gap:14px}
.login-title{font-size:18px;font-weight:bold;text-align:center}
.login-input{padding:10px 12px;background:#2d2d2d;border:1px solid #3a3a3a;border-radius:6px;font-size:14px;color:#eee;outline:none}
.login-input:focus{border-color:#2563eb}
.login-err{font-size:13px;color:#ff6b6b;min-height:16px;text-align:center}
.login-btn{padding:10px;background:#2563eb;border:none;border-radius:6px;font-size:15px;cursor:pointer;color:#fff}
.login-btn:hover{background:#1d4ed8}
@media (max-width:900px){
    .container{grid-template-columns:1fr;gap:12px}
    #video-box{position:sticky;top:0;z-index:10}
    .login-box{width:min(320px,92vw)}
    .anime-card-list{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}
</style>
</head>
<body>
<div class="container">
    <div id="video-box">
        <div id="animeTitle" class="anime-title-overlay">选择下方番剧开始播放</div>
        <video id="player" controls></video>
    </div>
    <div class="side">
        <div class="ep-wrap">
            <div class="info-text">播放列表</div>
            <div id="errBox" class="err-text"></div>
            <div id="epList" class="ep-list"></div>
        </div>
    </div>
</div>
<div id="allAnimeWrap" class="all-anime-wrap">
    <h3>剧集列表</h3>
    <div id="animeTypeBar" class="anime-type-bar"></div>
    <input id="animeFilter" class="anime-filter" type="text" placeholder="输入关键词筛选番剧标题…">
    <div id="animeCardList" class="anime-card-list"></div>
</div>

<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <div class="login-title">Anip在线观影</div>
        <input id="loginPwd" class="login-input" type="password" placeholder="请输入访问密码">
        <div id="loginErr" class="login-err"></div>
        <button id="loginBtn" class="login-btn">进入</button>
    </div>
</div>

<!-- 本地静态hls，先加载库，再执行业务脚本 -->
<script src="/static/hls.min.js"></script>
<script>
const LOGIN_PWDS = ["anip19941104", "hy19960414"];
const loginOverlay = document.getElementById('loginOverlay');
const loginPwd = document.getElementById('loginPwd');
const loginBtn = document.getElementById('loginBtn');
const loginErr = document.getElementById('loginErr');

function checkLogin(){
    if(sessionStorage.getItem('anip_authed') === '1'){
        if(loginOverlay) loginOverlay.classList.add('hidden');
        return true;
    }
    return false;
}
function doLogin(){
    if(!loginPwd || !loginOverlay) return;
    if(LOGIN_PWDS.includes(loginPwd.value)){
        sessionStorage.setItem('anip_authed', '1');
        loginOverlay.classList.add('hidden');
        loginErr.textContent = '';
    }else{
        loginErr.textContent = '密码错误，请重试';
        loginPwd.value = '';
        loginPwd.focus();
    }
}
if(loginBtn) loginBtn.onclick = doLogin;
if(loginPwd) loginPwd.addEventListener('keydown', e=>{ if(e.key === 'Enter') doLogin(); });
checkLogin();

let episodes = [];
let animeName = "";
let currentEpIndex = 0;
const player = document.getElementById('player');
const epListEl = document.getElementById('epList');
const errBox = document.getElementById('errBox');
const animeTitleEl = document.getElementById('animeTitle');
const allAnimeWrap = document.getElementById('allAnimeWrap');
const animeCardList = document.getElementById('animeCardList');
const animeFilterEl = document.getElementById('animeFilter');
const animeTypeBarEl = document.getElementById('animeTypeBar');
let hls = null;
let repoAnimeList = [];
let currentType = "全部";
const TYPE_LIST = ["全部", "电影", "剧集", "动漫"];

// 安全防护：如果Hls不存在直接报错提示
if(typeof Hls === "undefined"){
    errBox.textContent = "错误：hls.js 库加载失败";
}

function getUrlParam(key){
    const params = new URLSearchParams(location.search);
    return params.get(key);
}

async function loadJson(jsonUrl){
    errBox.textContent = "加载中...";
    animeTitleEl.textContent = "加载番剧信息...";
    try{
        const res = await fetch(jsonUrl);
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        animeName = data.title;
        episodes = data.episodes;
        animeTitleEl.textContent = animeName;
        const savedKey = `lastEp_${btoa(jsonUrl)}`;
        const saved = localStorage.getItem(savedKey);
        if(saved !== null) currentEpIndex = parseInt(saved);
        else currentEpIndex = 0;
        renderEpList();
        playEp(currentEpIndex);
        errBox.textContent = "";
    }catch(e){
        errBox.textContent = `JSON读取失败: ${e.message}`;
        console.error("加载json错误：",e);
    }
}

function renderEpList(){
    epListEl.innerHTML = '';
    episodes.forEach((ep,idx)=>{
        const div = document.createElement('div');
        div.className = "ep-item" + (idx === currentEpIndex ? " active":"");
        div.textContent = ep.title;
        div.onclick = ()=>{
            currentEpIndex = idx;
            playEp(currentEpIndex);
            renderEpList();
        }
        epListEl.appendChild(div);
    })
    const active = epListEl.querySelector('.ep-item.active');
    if(active) active.scrollIntoView({block:'nearest'});
}

function playEp(idx){
    if(typeof Hls === "undefined"){
        errBox.textContent = "hls库未加载，无法播放";
        return;
    }
    const ep = episodes[idx];
    if(hls){
        hls.destroy();
        hls = null;
    }
    if(Hls.isSupported()) {
        hls = new Hls({enableWorker:true, lowLatencyMode:false});
        hls.loadSource(ep.src);
        hls.attachMedia(player);
        hls.on(Hls.Events.MANIFEST_PARSED,()=>{ player.play(); });
    }else if(player.canPlayType('application/vnd.apple.mpegurl')){
        player.src = ep.src;
        player.play();
    }
    const savedKey = `lastEp_${btoa(getUrlParam('json')||'')}`;
    localStorage.setItem(savedKey, idx.toString());
}

document.addEventListener('keydown',e=>{
    if(e.key === "ArrowLeft"){
        if(currentEpIndex>0){
            currentEpIndex--;
            playEp(currentEpIndex);
            renderEpList();
        }
    }else if(e.key === "ArrowRight"){
        if(currentEpIndex < episodes.length-1){
            currentEpIndex++;
            playEp(currentEpIndex);
            renderEpList();
        }
    }
})

document.addEventListener("visibilitychange", ()=>{
    if (!document.hidden && !player.paused && hls) hls.startLoad();
});

function initTypeBar(){
    animeTypeBarEl.innerHTML = '';
    TYPE_LIST.forEach(type => {
        const btn = document.createElement("button");
        btn.className = "type-btn";
        btn.textContent = type;
        btn.onclick = ()=>{
            currentType = type;
            initTypeBar();
            renderAnimeCards();
        };
        animeTypeBarEl.appendChild(btn);
    });
    [...animeTypeBarEl.children].forEach(b => b.classList.toggle('active', b.textContent === currentType));
}

function renderAnimeCards(){
    const kw = animeFilterEl.value.trim().toLowerCase();
    const kwMatched = kw ? repoAnimeList.filter(item => item.title.toLowerCase().includes(kw)) : repoAnimeList;
    const matched = currentType === "全部" ? kwMatched : kwMatched.filter(item => (item.type || "动漫") === currentType);
    animeCardList.innerHTML = '';
    if(matched.length === 0){
        animeCardList.innerHTML = '<div class="anime-card loading">未找到匹配的番剧</div>';
        return;
    }
    for(const item of matched){
        const card = document.createElement("div");
        card.className = "anime-card";
        card.textContent = item.title;
        card.onclick = ()=> loadJson(`/${item.jsonFile}`);
        animeCardList.appendChild(card);
    }
}

async function loadRepoAnimeList(){
    animeCardList.innerHTML = '<div class="anime-card loading">读取剧集列表中…</div>';
    try{
        const resp = await fetch(`/index.json`);
        const fileArr = await resp.json();
        if(!Array.isArray(fileArr)){
            animeCardList.innerHTML = '<div class="anime-card loading">剧集清单读取异常</div>';
            return;
        }
        if(fileArr.length === 0){
            animeCardList.innerHTML = '<div class="anime-card loading">清单为空，请检查index.json</div>';
            return;
        }
        repoAnimeList = fileArr;
        renderAnimeCards();
    }catch(err){
        animeCardList.innerHTML = '<div class="anime-card loading">获取剧集列表失败：'+err.message+'</div>';
    }
}

function syncSideHeight(){
    const vb = document.getElementById('video-box');
    const side = document.querySelector('.side');
    if(vb && side){
        if(window.innerWidth < 900){
            side.style.height = '';
        }else{
            side.style.height = vb.offsetHeight + 'px';
        }
    }
}
syncSideHeight();
window.addEventListener('resize', syncSideHeight);

if(animeTypeBarEl) initTypeBar();
if(animeFilterEl) animeFilterEl.addEventListener('input', renderAnimeCards);

const jsonUrl = getUrlParam('json');
if(jsonUrl){
    loadJson(jsonUrl);
}else{
    animeTitleEl.textContent = "选择下方番剧开始播放";
    errBox.textContent = "";
    loadRepoAnimeList();
}
</script>
</body>
</html>
